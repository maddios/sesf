name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_EXTENSIONS: imagick, gd, intl, pdo_mysql, pdo_sqlite, bcmath, zip, pcntl, exif, mbstring

jobs:
  backend:
    name: Backend (Pint, Larastan, audit, Pest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: pcov

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.5-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.5-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install JS dependencies and build
        # The SPA shell test needs the Vite manifest.
        run: |
          npm ci
          npm run build

      - name: Lint (Pint)
        run: composer lint

      - name: Static analysis (Larastan)
        run: composer analyse

      - name: Audit PHP dependencies
        run: composer audit --locked

      - name: Tests with coverage
        # TODO: raise --min to 85 once coverage is stable.
        run: vendor/bin/pest --coverage --min=0

  frontend:
    name: Frontend (lint, typecheck, tests, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests with coverage
        run: npm run test:coverage

      - name: Audit npm dependencies
        run: npm audit --audit-level=low

  e2e:
    name: E2E (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install JS dependencies and build
        run: |
          npm ci
          npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Laravel server
        env:
          APP_ENV: testing
        run: |
          php artisan serve --port=8000 > "$RUNNER_TEMP/serve.log" 2>&1 &
          timeout 60 bash -c 'until curl -sf http://localhost:8000 > /dev/null; do sleep 1; done'

      - name: Run E2E tests
        env:
          E2E_BASE_URL: http://localhost:8000
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
