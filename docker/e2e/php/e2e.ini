; Loaded only inside the e2eapp sandbox container (PHP_INI_SCAN_DIR in docker/e2e/app.env).
; /tmp/sesf-e2e-ca.pem is the system CA bundle plus the throwaway paypalstub certificate,
; assembled by the e2eapp command at start-up.
curl.cainfo=/tmp/sesf-e2e-ca.pem
openssl.cafile=/tmp/sesf-e2e-ca.pem
upload_max_filesize=20M
post_max_size=25M
memory_limit=512M
