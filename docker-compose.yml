services:
  app:
    image: sesf-php:dev
    build:
      context: docker/php
    working_dir: /app
    user: "1000:1000"
    environment:
      COMPOSER_HOME: /tmp/composer
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000

  node:
    image: node:24
    working_dir: /app
    user: "1000:1000"
    volumes:
      - .:/app
