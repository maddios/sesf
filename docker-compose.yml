services:
  app:
    image: sesf-php:dev
    build:
      context: docker/php
    working_dir: /app
    user: "1000:1000"
    environment:
      COMPOSER_HOME: /tmp/composer
    volumes:
      - .:/app
      # Dev file store: the already-copied production-like store, mounted
      # read-write over the (git-ignored) repo-relative paths. DEV_STORE_DIR
      # is optional (default /var/www/sesf-dev-store). Run scripts/dev-setup.sh
      # once first: it creates the repo mountpoint dirs as the invoking user
      # and checks the store. create_host_path: false makes compose fail
      # instead of letting dockerd create missing host dirs (root-owned).
      - type: bind
        source: ${DEV_STORE_DIR:-/var/www/sesf-dev-store}/public/images/members
        target: /app/public/images/members
        bind: {create_host_path: false}
      - type: bind
        source: ${DEV_STORE_DIR:-/var/www/sesf-dev-store}/public/images/cars
        target: /app/public/images/cars
        bind: {create_host_path: false}
      - type: bind
        source: ${DEV_STORE_DIR:-/var/www/sesf-dev-store}/public/images/shows
        target: /app/public/images/shows
        bind: {create_host_path: false}
      - type: bind
        source: ${DEV_STORE_DIR:-/var/www/sesf-dev-store}/public/images/sponsor
        target: /app/public/images/sponsor
        bind: {create_host_path: false}
      - type: bind
        source: ${DEV_STORE_DIR:-/var/www/sesf-dev-store}/public/images/gallery
        target: /app/public/images/gallery
        bind: {create_host_path: false}
      - type: bind
        source: ${DEV_STORE_DIR:-/var/www/sesf-dev-store}/public/images/judging
        target: /app/public/images/judging
        bind: {create_host_path: false}
      - type: bind
        source: ${DEV_STORE_DIR:-/var/www/sesf-dev-store}/public/packet
        target: /app/public/packet
        bind: {create_host_path: false}
      - type: bind
        source: ${DEV_STORE_DIR:-/var/www/sesf-dev-store}/public/waivers
        target: /app/public/waivers
        bind: {create_host_path: false}
      - type: bind
        source: ${DEV_STORE_DIR:-/var/www/sesf-dev-store}/storage/waivers
        target: /app/storage/waivers
        bind: {create_host_path: false}
    ports:
      - "8000:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000

  node:
    image: node:24
    working_dir: /app
    user: "1000:1000"
    volumes:
      - .:/app

  vite:
    image: node:24
    init: true
    user: "1000:1000"
    working_dir: /app
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/npm-cache
      VITE_HOST: 0.0.0.0
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    # npm ci runs when node_modules/.package-lock.json is missing or differs from package-lock.json
    # (cmp fails on a missing file), so lockfile changes trigger a reinstall; never npm install.
    # `npm run dev` does not forward SIGTERM to vite, so exec the vite binary directly. tini (init)
    # is PID 1 and vite is its child; SIGTERM is forwarded to vite, so laravel-vite-plugin removes public/hot.
    command: sh -c "cmp -s package-lock.json node_modules/.package-lock.json || npm ci --no-audit --no-fund; exec ./node_modules/.bin/vite"

  # Test runner (profile "test"). Same image and uid as app, but only the repo bind mount:
  # no dev-store mounts, so tests run without scripts/dev-setup.sh. scripts/test.sh runs pest here.
  test:
    image: sesf-php:dev
    build:
      context: docker/php
    profiles: ["test"]
    working_dir: /app
    user: "1000:1000"
    environment:
      COMPOSER_HOME: /tmp/composer
      DB_TEST_HOST: testdb
    volumes:
      - .:/app
    depends_on:
      testdb:
        condition: service_healthy

  # Ephemeral MariaDB for automated tests only (never the shared sesf_dev DB).
  # Schema is loaded by tests/Support/LoadsLegacySchema.php. Data lives on tmpfs,
  # and no host port is published, so only containers on this project network reach it.
  # Pinned to 10.11.19, the newest exact 10.11 tag on Docker Hub and the first 10.11 release
  # listed as fixing the current advisories (see docs/ci.md). Use scripts/test.sh rather than
  # running this by hand.
  testdb:
    image: mariadb:10.11.19
    profiles: ["test"]
    environment:
      MARIADB_ROOT_PASSWORD: test
      MARIADB_DATABASE: sesf_test
    tmpfs:
      - /var/lib/mysql
    command:
      - --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION
      - --character-set-server=latin1
      - --collation-server=latin1_swedish_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s
